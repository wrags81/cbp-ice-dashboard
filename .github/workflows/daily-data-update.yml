name: Daily Data Update

on:
  schedule:
    # Every 6 hours — catches USAspending's daily batch whenever it posts,
    # rather than missing a day if the batch lands right after our run.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write            # Required to push commits back to main

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest FY2027 data (current fiscal year)
        run: python3 fetch_and_build.py 2027

      # FY2026 closed Sept 30, 2026; late modifications still land occasionally.
      # Allow this step to fail without blocking the FY2027 commit.
      - name: Fetch latest FY2026 data
        continue-on-error: true
        run: python3 fetch_and_build.py 2026

      - name: Write last-checked timestamp
        # Always write this, even when no new transactions landed. Lets the
        # dashboard show "Last checked: X" so a quiet day looks different
        # from a broken pipeline.
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last_checked.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            latest=$(python3 -c "import csv; \
              rows = list(csv.DictReader(open('data/CBP_ICE_FY2027_Contract_Obligations.csv'))); \
              dates = sorted({r['Action Date'] for r in rows if r['Action Date']}); \
              print(dates[-1] if dates else 'empty')")
            git commit -m "Auto-update FY2027 CBP/ICE data through ${latest}"
            git push
          fi
