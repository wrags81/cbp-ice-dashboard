name: Daily Data Update

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (6am ET / 5am ET during DST)
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write            # Required to push commits back to main

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest FY2027 data (current fiscal year)
        run: python3 fetch_and_build.py 2027

      # FY2026 closed Sept 30, 2026; late modifications still land occasionally.
      # Allow this step to fail without blocking the FY2027 commit.
      - name: Fetch latest FY2026 data
        continue-on-error: true
        run: python3 fetch_and_build.py 2026

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            latest=$(python3 -c "import csv; \
              rows = list(csv.DictReader(open('data/CBP_ICE_FY2027_Contract_Obligations.csv'))); \
              dates = sorted({r['Action Date'] for r in rows if r['Action Date']}); \
              print(dates[-1] if dates else 'empty')")
            git commit -m "Auto-update FY2027 CBP/ICE data through ${latest}"
            git push
          fi
