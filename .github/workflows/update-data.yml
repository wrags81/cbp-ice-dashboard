name: Daily Data Update

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (6am ET / 5am ET during DST)
  workflow_dispatch:       # Manual trigger from GitHub UI

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write            # Required to push commits back to main

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest FY2026 data
        run: python3 fetch_and_build.py 2026

      # FY2025 is closed; late modifications are rare. Allow this step to
      # fail without blocking the FY2026 commit.
      - name: Fetch latest FY2025 data
        continue-on-error: true
        run: python3 fetch_and_build.py 2025

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            latest=$(python3 -c "import csv; \
              rows = list(csv.DictReader(open('data/CBP_ICE_FY2026_Contract_Obligations.csv'))); \
              print(sorted({r['Action Date'] for r in rows if r['Action Date']})[-1])")
            git commit -m "Auto-update FY2026 CBP/ICE data through ${latest}"
            git push
          fi
